<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SetuCivic — Civic Issue Reporting &amp; Escalation Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2A3D;
  --navy-2:#173B54;
  --paper:#F3F6F6;
  --paper-2:#E7ECEC;
  --line:#D6DEDD;
  --ink:#132327;
  --ink-soft:#5B6E70;
  --amber:#E8A33D;
  --teal:#1F7A6C;
  --red:#C0392B;
  --blue:#2E6E9E;
  --white:#FFFFFF;
  --sev-low:#4C8C6B;
  --sev-medium:#C98A2C;
  --sev-high:#C0642B;
  --sev-critical:#B23B3B;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{font-family:'Space Grotesk',sans-serif; font-weight:600; letter-spacing:-0.01em;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
a{color:inherit; text-decoration:none;}
::selection{background:var(--amber); color:var(--navy);}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#B9C6C5; border-radius:4px;}

/* ===== APP SHELL ===== */
#app{min-height:100vh; display:flex; flex-direction:column;}

/* topbar */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 20px; background:var(--navy); color:#fff;
  position:sticky; top:0; z-index:50;
}
.brand{display:flex; align-items:center; gap:10px;}
.seal{
  width:34px; height:34px; border-radius:50%;
  background:conic-gradient(from 45deg, var(--amber), #fff0 0deg 0deg);
  border:2px solid var(--amber);
  display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; color:var(--amber);
  flex-shrink:0;
}
.brand-text .t1{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; line-height:1.1;}
.brand-text .t2{font-size:10px; letter-spacing:.08em; text-transform:uppercase; opacity:.65;}
.topbar-right{display:flex; align-items:center; gap:14px;}
.icon-btn{
  width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  color:#fff; position:relative; background:rgba(255,255,255,.08);
}
.icon-btn:hover{background:rgba(255,255,255,.16);}
.badge-dot{
  position:absolute; top:-3px; right:-3px; min-width:15px; height:15px; padding:0 3px; border-radius:8px;
  background:var(--red); color:#fff; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center;
  border:2px solid var(--navy);
}
.role-chip{
  font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:600;
  background:rgba(232,163,61,.16); color:var(--amber); padding:5px 10px; border-radius:20px;
  border:1px solid rgba(232,163,61,.35);
}

/* layout: sidebar (staff) */
.layout{flex:1; display:flex; min-height:0;}
.sidebar{
  width:236px; background:var(--navy-2); color:#EAF1F0; flex-shrink:0;
  display:flex; flex-direction:column; padding:18px 12px;
}
.sidebar-nav{margin-top:10px; display:flex; flex-direction:column; gap:2px;}
.snav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px;
  color:#C6D6D4; font-size:13.5px; font-weight:500;
}
.snav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.snav-item.active{background:var(--amber); color:var(--navy); font-weight:700;}
.sidebar-foot{margin-top:auto; padding:12px; font-size:11px; color:#8FA5A3; border-top:1px solid rgba(255,255,255,.1);}

.main{flex:1; min-width:0; overflow-y:auto; padding:22px 26px 60px;}
.main.mobile-main{padding:0 0 78px; max-width:480px; margin:0 auto; width:100%; background:var(--paper);}

/* mobile phone frame */
.mobile-shell{max-width:480px; margin:0 auto; width:100%; min-height:100vh; display:flex; flex-direction:column; background:var(--paper); box-shadow:0 0 0 1px var(--line);}
.bottom-nav{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px; background:#fff; border-top:1px solid var(--line);
  display:flex; z-index:60;
}
.bn-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px 8px; color:#8B9E9C; font-size:10px; font-weight:600;}
.bn-item.active{color:var(--navy);}
.bn-item.active svg{stroke:var(--amber);}
.bn-item .fab-circle{
  width:46px; height:46px; border-radius:50%; background:var(--amber); display:flex; align-items:center; justify-content:center;
  margin-top:-24px; box-shadow:0 4px 10px rgba(232,163,61,.4); border:4px solid #fff;
}
.bn-item .fab-circle svg{stroke:var(--navy);}

/* section header */
.page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
.page-head h1{font-size:22px;}
.page-head p{color:var(--ink-soft); font-size:13px; margin-top:3px;}
.eyebrow{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--teal); font-weight:700; margin-bottom:4px;}

/* cards */
.card{background:#fff; border:1px solid var(--line); border-radius:12px;}
.pad{padding:16px;}
.grid{display:grid; gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}

.kpi{padding:16px; display:flex; flex-direction:column; gap:6px;}
.kpi .label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600;}
.kpi .value{font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700;}
.kpi .sub{font-size:11px; color:var(--ink-soft);}
.kpi.accent-navy{border-top:3px solid var(--navy);}
.kpi.accent-amber{border-top:3px solid var(--amber);}
.kpi.accent-teal{border-top:3px solid var(--teal);}
.kpi.accent-red{border-top:3px solid var(--red);}

/* buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:10px 16px; border-radius:9px; font-size:13.5px; font-weight:600; white-space:nowrap;
  transition:transform .05s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--navy); color:#fff;}
.btn-primary:hover{background:#0B2130;}
.btn-amber{background:var(--amber); color:var(--navy);}
.btn-amber:hover{background:#DE9628;}
.btn-outline{background:#fff; border:1.4px solid var(--line); color:var(--ink);}
.btn-outline:hover{border-color:var(--navy);}
.btn-ghost{color:var(--navy); font-weight:600;}
.btn-ghost:hover{text-decoration:underline;}
.btn-danger{background:var(--red); color:#fff;}
.btn-sm{padding:6px 11px; font-size:12px; border-radius:7px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.45; pointer-events:none;}

/* chips / status */
.chip{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.02em;}
.chip::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor;}
.chip-low{background:#EAF3EC; color:var(--sev-low);}
.chip-medium{background:#FBF0DF; color:var(--sev-medium);}
.chip-high{background:#FBE7DD; color:var(--sev-high);}
.chip-critical{background:#FBE2E0; color:var(--sev-critical);}
.chip-submitted{background:#E9EEF3; color:var(--blue);}
.chip-verification{background:#F2ECFB; color:#7A4FC9;}
.chip-verified{background:#E4F2EE; color:var(--teal);}
.chip-assigned{background:#EFF0F8; color:#5A5FC7;}
.chip-accepted{background:#E6EEF6; color:var(--blue);}
.chip-progress{background:#FDF2DC; color:#B5810E;}
.chip-resolved{background:#E2F3EA; color:#2C8558;}
.chip-closed{background:#E8ECEC; color:#5B6E70;}
.chip-escalated{background:#FCE3E1; color:var(--red);}
.chip-duplicate{background:#EDEDED; color:#767676;}
.chip-reopened{background:#FCEBD9; color:#B05B15;}
.chip-suspicious{background:#FBE2E0; color:var(--red);}

.status-dot{width:8px; height:8px; border-radius:50%; display:inline-block;}

/* form elements */
label.f{display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; color:var(--ink);}
.help{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],textarea,select{
  width:100%; padding:10px 12px; border-radius:8px; border:1.4px solid var(--line); font-family:inherit; font-size:13.5px; background:#fff; color:var(--ink);
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--amber); outline-offset:1px; border-color:var(--amber);}
textarea{resize:vertical; min-height:80px;}
.field{margin-bottom:14px;}
.otp-boxes{display:flex; gap:8px;}
.otp-boxes input{width:42px; height:48px; text-align:center; font-size:18px; font-weight:700;}

.cat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.cat-tile{
  border:1.6px solid var(--line); border-radius:12px; padding:12px 8px; text-align:center; background:#fff;
  display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11px; font-weight:600; color:var(--ink);
}
.cat-tile svg{stroke:var(--navy);}
.cat-tile.selected{border-color:var(--amber); background:#FFF8EC; box-shadow:0 0 0 1px var(--amber) inset;}
.cat-tile.selected svg{stroke:var(--amber);}

/* stepper */
.stepper{display:flex; align-items:center; gap:6px; margin-bottom:18px;}
.step-dot{
  flex:1; height:5px; border-radius:3px; background:var(--paper-2);
}
.step-dot.done{background:var(--teal);}
.step-dot.current{background:var(--amber);}

/* timeline */
.timeline{position:relative; padding-left:26px;}
.tl-item{position:relative; padding-bottom:20px;}
.tl-item::before{content:''; position:absolute; left:-20px; top:2px; width:11px; height:11px; border-radius:50%; background:var(--line); border:2px solid #fff; box-shadow:0 0 0 1.5px var(--line);}
.tl-item.done::before{background:var(--teal); box-shadow:0 0 0 1.5px var(--teal);}
.tl-item.current::before{background:var(--amber); box-shadow:0 0 0 1.5px var(--amber);}
.tl-item::after{content:''; position:absolute; left:-15px; top:14px; bottom:-6px; width:1.6px; background:var(--line);}
.tl-item:last-child::after{display:none;}
.tl-title{font-size:13px; font-weight:700;}
.tl-meta{font-size:11px; color:var(--ink-soft); margin-top:2px;}
.tl-note{font-size:12px; color:var(--ink-soft); margin-top:4px; background:var(--paper); border-radius:7px; padding:7px 9px;}

/* complaint id stamp */
.stamp{
  display:inline-flex; align-items:center; gap:8px; border:2px solid var(--navy); border-radius:8px; padding:5px 11px;
  transform:rotate(-1.2deg); font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12.5px; color:var(--navy);
  background:repeating-linear-gradient(135deg, rgba(15,42,61,.03) 0 6px, transparent 6px 12px);
}

/* table */
table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:700; padding:9px 10px; border-bottom:1.4px solid var(--line);}
td{padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:hover td{background:#FAFBFB;}
.table-wrap{overflow-x:auto;}

/* notif */
.notif-item{display:flex; gap:11px; padding:12px 14px; border-bottom:1px solid var(--line);}
.notif-item:last-child{border-bottom:none;}
.notif-ico{width:34px; height:34px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--paper-2);}
.notif-text{font-size:13px; font-weight:600;}
.notif-sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.notif-time{font-size:10.5px; color:#9DABA9; white-space:nowrap;}
.notif-unread{background:#FFFBF3;}

/* ai panel */
.ai-flow{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:11.5px; font-weight:600; color:var(--ink-soft);}
.ai-flow .node{background:var(--paper); border:1px solid var(--line); border-radius:7px; padding:4px 9px;}
.ai-flow .arrow{color:#B9C6C5;}
.mock-tag{font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; color:#fff; background:var(--ink-soft); padding:2px 7px; border-radius:5px;}

/* modal */
.overlay{position:fixed; inset:0; background:rgba(11,25,35,.55); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;}
.modal{background:#fff; border-radius:14px; max-width:520px; width:100%; max-height:88vh; overflow-y:auto;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line);}
.modal-body{padding:18px;}
.modal-foot{padding:14px 18px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}

/* toast */
#toast-wrap{position:fixed; top:70px; right:20px; z-index:400; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:var(--navy); color:#fff; padding:11px 16px; border-radius:9px; font-size:13px; font-weight:600;
  box-shadow:0 8px 20px rgba(0,0,0,.18); display:flex; align-items:center; gap:9px; min-width:240px; max-width:340px;
  animation:slidein .25s ease;
}
.toast.success{background:var(--teal);}
.toast.warn{background:var(--amber); color:var(--navy);}
.toast.danger{background:var(--red);}
@keyframes slidein{from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:translateX(0);}}

/* map mock */
.map-box{
  position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--line);
  background:
   linear-gradient(0deg, rgba(15,42,61,.05) 1px, transparent 1px) 0 0/28px 28px,
   linear-gradient(90deg, rgba(15,42,61,.05) 1px, transparent 1px) 0 0/28px 28px,
   #E9EFEE;
  height:100%;
}
.map-pin{position:absolute; transform:translate(-50%,-100%); display:flex; flex-direction:column; align-items:center; cursor:pointer;}
.map-pin .dot{width:16px; height:16px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); border:2px solid #fff; box-shadow:0 2px 5px rgba(0,0,0,.3);}
.map-pin.critical .dot{background:var(--sev-critical);}
.map-pin.high .dot{background:var(--sev-high);}
.map-pin.medium .dot{background:var(--sev-medium);}
.map-pin.low .dot{background:var(--sev-low);}
.map-pin .pin-label{margin-top:2px; background:#132327; color:#fff; font-size:9.5px; padding:2px 5px; border-radius:4px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s;}
.map-pin:hover .pin-label{opacity:1;}
.map-legend{position:absolute; bottom:10px; left:10px; background:rgba(255,255,255,.92); border-radius:8px; padding:8px 10px; font-size:10.5px; display:flex; gap:10px; border:1px solid var(--line);}
.map-legend span{display:flex; align-items:center; gap:5px;}
.map-legend i{width:8px; height:8px; border-radius:50%; display:inline-block;}

/* misc */
.divider{height:1px; background:var(--line); margin:16px 0;}
.muted{color:var(--ink-soft);}
.flex{display:flex;} .items-center{align-items:center;} .justify-between{justify-content:space-between;} .gap-8{gap:8px;} .gap-10{gap:10px;} .gap-14{gap:14px;}
.upload-box{border:2px dashed var(--line); border-radius:10px; padding:18px; text-align:center; color:var(--ink-soft); font-size:12.5px; background:#FAFBFB;}
.upload-thumb{width:64px; height:64px; border-radius:8px; background:linear-gradient(135deg,#DDE7E5,#C6D3D1); display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0;}
.tag-row{display:flex; flex-wrap:wrap; gap:6px;}
.progress-bar{height:7px; border-radius:4px; background:var(--paper-2); overflow:hidden;}
.progress-bar > div{height:100%; border-radius:4px;}
.score-ring{position:relative; width:64px; height:64px;}
.priority-score-lg{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:34px;}
.hidden{display:none !important;}
.hint-banner{background:#EFF6FB; border:1px solid #CFE3F0; color:#215379; padding:10px 13px; border-radius:9px; font-size:12px; display:flex; gap:9px; align-items:flex-start;}
.warn-banner{background:#FDF4E4; border:1px solid #F0DBA9; color:#7A5710; padding:10px 13px; border-radius:9px; font-size:12px; display:flex; gap:9px; align-items:flex-start;}
.danger-banner{background:#FBE7E5; border:1px solid #EFC1BB; color:#8A2E23; padding:10px 13px; border-radius:9px; font-size:12px; display:flex; gap:9px; align-items:flex-start;}
.link-inline{color:var(--blue); font-weight:600; cursor:pointer;}
.avatar{width:34px; height:34px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;}
.card-hover:hover{border-color:var(--amber); box-shadow:0 2px 10px rgba(15,42,61,.06);}
.emoji-badge{width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.slider-row{display:flex; align-items:center; gap:10px;}
input[type=range]{flex:1; accent-color:var(--amber);}
.login-shell{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--navy); padding:20px;}
.login-card{background:#fff; border-radius:16px; padding:32px 30px; max-width:400px; width:100%;}
.role-pick{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
.role-btn{border:1.6px solid var(--line); border-radius:10px; padding:12px 10px; text-align:left; font-size:12.5px;}
.role-btn.active{border-color:var(--amber); background:#FFF8EC;}
.role-btn .rt{font-weight:700; font-size:13px; display:flex; align-items:center; gap:7px;}
.small{font-size:11.5px;}
.close-x{width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);}
.close-x:hover{background:var(--paper);}
</style>
</head>
<body>
<div id="toast-wrap"></div>
<div id="app"></div>

<script>
/* ============================================================
   SETUCIVIC — CIVIC ISSUE REPORTING & ESCALATION PLATFORM
   Functional front-end prototype. All AI, backend & GPS calls
   are SIMULATED — see AI_SERVICE / API_SERVICE below, which are
   built as swappable modules for real FastAPI + ML integration.
   ============================================================ */

/* ---------------- ICONS (feather-style inline svg) ---------------- */
const ICONS = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  report:'<path d="M12 5v14M5 12h14"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3" cy="6" r="1"/><circle cx="3" cy="12" r="1"/><circle cx="3" cy="18" r="1"/>',
  map:'<path d="M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3z"/><path d="M9 4v13M15 7v13"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>',
  bell:'<path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/>',
  vote:'<path d="M7 11l5-7 5 7"/><path d="M12 4v16"/><path d="M5 21h14"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>',
  camera:'<path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h3l2-3h8l2 3h3a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/>',
  pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  chev:'<path d="M9 18l6-6-6-6"/>',
  chevDown:'<path d="M6 9l6 6 6-6"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',

/* ---------------- PRIORITY ENGINE ---------------- */
function computePriority(c){
  const sevScore = (sevRank(c.severity)+1)/4*100; // 25,50,75,100
  const commScore = Math.min(100, c.supporters*10);
  const impactMap = {roads:70,waste:55,water:80,drainage:75,electricity:85,streetlight:45,parks:35,emergency:100};
  const impactScore = impactMap[c.categoryId] ?? 50;
  const hoursWaiting = (Date.now() - c.createdAt) / 3600000;
  const deadline = CONFIG.deadlines[c.severity] || 72;
  const waitScore = Math.min(100, (hoursWaiting/deadline)*100);
  const w = CONFIG.weights;
  const total = (sevScore*w.severity + commScore*w.community + impactScore*w.impact + waitScore*w.waiting)/100;
  return Math.round(Math.min(100,total));
}
function priorityLabel(score){
  if(score>=80) return 'CRITICAL';
  if(score>=60) return 'HIGH';
  if(score>=35) return 'MEDIUM';
  return 'LOW';
}

/* ---------------- UTIL ---------------- */
function distanceMeters(a,b){
  const R=6371000;
  const dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
  const la1=a.lat*Math.PI/180, la2=b.lat*Math.PI/180;
  const h=Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(ts){ const d=new Date(ts); return d.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function hoursLeft(c){
  const deadline = c.createdAt + (CONFIG.deadlines[c.severity]||72)*3600000;
  return (deadline - Date.now())/3600000;
}

/* performance computation per department */
function computePerformance(){
  const depts = {};
  DB.complaints.forEach(c=>{
    if(!depts[c.department]) depts[c.department] = {dept:c.department, total:0, resolved:0, escalated:0, onTime:0, resTimes:[], respTimes:[], ratings:[]};
    const d = depts[c.department];
    d.total++;
    if(c.status==='Resolved'||c.status==='Closed') d.resolved++;
    if(c.status==='Escalated'||c.escalated) d.escalated++;
    const hLeft = hoursLeft(c);
    if((c.status==='Resolved'||c.status==='Closed') && !c.escalated) d.onTime++;
    d.resTimes.push(2+Math.random()*40);
    d.respTimes.push(0.5+Math.random()*6);
    if(c.feedback) d.ratings.push(c.feedback.rating);
  });
  Object.values(depts).forEach(d=>{
    d.resolutionRate = Math.round((d.resolved/d.total)*100);
    d.escalationRate = Math.round((d.escalated/d.total)*100);
    d.avgResponse = (d.respTimes.reduce((a,b)=>a+b,0)/d.respTimes.length).toFixed(1);
    d.avgResolution = (d.resTimes.reduce((a,b)=>a+b,0)/d.resTimes.length).toFixed(1);
    d.avgRating = d.ratings.length ? (d.ratings.reduce((a,b)=>a+b,0)/d.ratings.length).toFixed(1) : '—';
    const deadlineAdherence = Math.max(0,100-d.escalationRate*1.4);
    d.score = Math.round(d.resolutionRate*0.35 + deadlineAdherence*0.3 + (100-d.escalationRate)*0.2 + (d.ratings.length? d.avgRating*20*0.15 : 12));
    d.score = Math.min(99, Math.max(38, d.score));
    d.badges = [];
    if(d.avgResponse < 2.2) d.badges.push('Fast Responder');
    if(d.resolutionRate >= 60) d.badges.push('High Resolution');
    if(d.escalationRate <= 15) d.badges.push('Deadline Champion');
    if(d.ratings.length && d.avgRating >= 4) d.badges.push('Citizen Satisfaction');
  });
  const arr = Object.values(depts).sort((a,b)=>b.score-a.score);
  if(arr[0]) arr[0].badges.push('Best Performing Department');
  return arr;
}

  const dup = AI_SERVICE.findDuplicate({categoryId:d.categoryId, id:'draft', location:d.location}, DB.complaints);

  const card=document.createElement('div'); card.className='card pad'; card.style.marginBottom='14px';
  card.innerHTML=`
    <label class="f">Review before submitting</label>
    <table style="font-size:13px;">
      <tr><td class="muted" style="width:110px;">Category</td><td><b>${cat.name}</b></td></tr>
      <tr><td class="muted">Issue type</td><td>${d.type}</td></tr>
      <tr><td class="muted">Description</td><td>${d.description}</td></tr>
      <tr><td class="muted">Location</td><td>${nearestWard(d.location)}</td></tr>
      <tr><td class="muted">Photos</td><td>${d.images.length} attached</td></tr>
      <tr><td class="muted">Auto severity</td><td><span class="chip chip-${sevAssess.severity.toLowerCase()}">${sevAssess.severity}</span></td></tr>
      <tr><td class="muted">Auto-routed to</td><td><b>${dept}</b></td></tr>
    </table>`;
  w.appendChild(card);

  if(dup){
    const dc = document.createElement('div'); dc.className='card pad'; dc.style.marginBottom='14px'; dc.style.borderColor='var(--amber)';
    dc.innerHTML=`
      <div class="flex items-center gap-8" style="margin-bottom:8px;"><span class="mock-tag" style="background:var(--amber);color:var(--navy);">Duplicate check</span></div>
      <b>Similar complaint found nearby</b>
      <p class="small muted" style="margin:4px 0 10px;">Existing complaint <span class="mono">${dup.complaint.id}</span> is ${dup.distance} metres away and matches this category.</p>
      <div class="flex gap-10">
        <button class="btn btn-outline btn-sm" style="flex:1;" id="continue-new">Continue as new</button>
        <button class="btn btn-amber btn-sm" style="flex:1;" id="support-existing">Support existing</button>
      </div>`;
    w.appendChild(dc);
    dc.querySelector('#support-existing').onclick=()=>{
      dup.complaint.supporters++;
      dup.complaint.priority = computePriority(dup.complaint); dup.complaint.priorityLabel=priorityLabel(dup.complaint.priority);
      toast(`Added your support to ${dup.complaint.id}`,'success');
      S.reportDraft=null; S._activeComplaintId=dup.complaint.id; go('complaint-detail');
    };
    dc.querySelector('#continue-new').onclick=()=>{ dc.style.display='none'; w._forceNew=true; submitBtn.disabled=false; };
  }

  const verify = AI_SERVICE.verifyReport({hasImage:d.images.length>0, description:d.description});
  const vcard=document.createElement('div'); vcard.className='card pad'; vcard.style.marginBottom='14px';
  const vClass = verify.status==='VERIFIED'?'hint-banner':verify.status==='SUSPICIOUS'?'danger-banner':'warn-banner';
  vcard.innerHTML=`<div class="${vClass}">${icon('shield',15)}<div><b>${verify.status}</b>${verify.flags.length?'<br><span class="small">'+verify.flags.join(' · ')+'</span>':''}<div class="small" style="margin-top:4px;"><span class="mock-tag">Simulated verification</span></div></div></div>`;
  w.appendChild(vcard);

  const submitBtn = document.createElement('button');
  submitBtn.className='btn btn-primary btn-block'; submitBtn.textContent='Submit Complaint';
  submitBtn.disabled = !!dup;
  submitBtn.onclick = ()=> submitComplaint(d, {ai, sevAssess, verify, dept});
  const nav = document.createElement('div'); nav.style.cssText='display:flex;gap:10px;margin-top:6px;';
  const back = document.createElement('button'); back.className='btn btn-outline'; back.textContent='Back'; back.onclick=()=>{ d.step=4; go('report'); };
  nav.appendChild(back); nav.appendChild(submitBtn);
  w.appendChild(nav);
  return w;
}
function submitComplaint(d, ctx){
  const now = Date.now();
  const id = `CIV-2026-${String(DB.complaints.length+1).padStart(5,'0')}`;
  const c = {
    id, categoryId:d.categoryId, categoryName:catById(d.categoryId).name, type:d.type,
    description:d.description, images:d.images, location:d.location, ward:nearestWard(d.location),
    department:ctx.dept, officer:OFFICERS[ctx.dept], citizen:S.user.name, createdAt:now,
    status: ctx.verify.status==='VERIFIED' ? 'Verified' : (ctx.verify.status==='SUSPICIOUS'?'Suspicious':'Requires Manual Verification'),
    supporters:1, verification:ctx.verify.status, verificationFlags:ctx.verify.flags,
    history:[
      {stage:'Submitted', ts:now, note:'Complaint received from citizen application.'},
      {stage:'AI Verification', ts:now+60000, note:`Automated pipeline: ${ctx.verify.status}`},
    ],
    feedback:null, escalated:false, duplicateOf:null, aiConfidence:ctx.ai.confidence, severity:ctx.sevAssess.severity, severityReason:ctx.sevAssess.reason,
  };
  if(ctx.verify.status==='VERIFIED'){
    c.history.push({stage:'Verified', ts:now+120000, note:'Report verified — evidence consistent.'});
    c.history.push({stage:'Assigned', ts:now+180000, note:`Automatically routed to ${ctx.dept} based on category and jurisdiction.`});
    c.status='Assigned';
  }
  c.priority = computePriority(c); c.priorityLabel = priorityLabel(c.priority);
  DB.complaints.unshift(c);
  DB.notifications.unshift({id:uid('N'), ts:now, unread:true, icon:'check', title:`${c.id} submitted successfully`, sub:`${c.type} · ${c.ward}`, audience:'all'});
  if(c.status==='Assigned'){
    DB.notifications.unshift({id:uid('N'), ts:now+1000, unread:true, icon:'dept', title:`Routed to ${ctx.dept}`, sub:c.id, audience:'all'});
  }
  S.reportDraft=null;
  toast('Complaint submitted · ID '+c.id,'success');
  S._activeComplaintId = c.id;
  go('complaint-detail');
}

  if(!c){ el.innerHTML = EmptyState('Complaint not found',''); return el; }
  const deptOfficer = c.officer;
  const hrsLeft = hoursLeft(c);
  el.innerHTML = `
    <button class="btn-ghost small" id="back-btn" style="margin-bottom:10px;">${icon('chev',14)} Back</button>
    <div class="flex items-center justify-between" style="margin-bottom:10px;flex-wrap:wrap;gap:8px;">
      <span class="stamp">${c.id}</span>
      <span class="chip ${chipClassForStatus(c.status)}">${c.status}</span>
    </div>
    <h2 style="font-size:18px;margin-bottom:4px;">${c.type}</h2>
    <div class="small muted" style="margin-bottom:14px;">${c.categoryName} · ${icon('pin',12)} ${c.ward} · Reported ${fmtDateTime(c.createdAt)}</div>

    <div class="card pad" style="margin-bottom:14px;">
      <div class="grid grid-2" style="gap:10px;">
        <div><div class="small muted">Severity</div><span class="chip chip-${c.severity.toLowerCase()}" style="margin-top:4px;">${c.severity}</span></div>
        <div><div class="small muted">Priority score</div><div style="font-weight:700;">${c.priority}/100 · ${c.priorityLabel}</div></div>
        <div><div class="small muted">Assigned department</div><div style="font-weight:600;font-size:13px;">${c.department}</div></div>
        <div><div class="small muted">Field officer</div><div style="font-weight:600;font-size:13px;">${deptOfficer||'Pending assignment'}</div></div>
        <div><div class="small muted">Supporters</div><div style="font-weight:600;">${c.supporters} citizens</div></div>
        <div><div class="small muted">Deadline</div><div style="font-weight:600;color:${hrsLeft<0?'var(--red)':hrsLeft<8?'var(--amber)':'var(--ink)'};">${hrsLeft<0?'Overdue':Math.round(hrsLeft)+'h remaining'}</div></div>
      </div>
    </div>

    <div class="card pad" style="margin-bottom:14px;">
      <div class="flex items-center justify-between" style="margin-bottom:8px;"><b style="font-size:13px;">Description</b></div>
      <p class="small">${c.description}</p>
      ${c.images && c.images.length ? `<div class="tag-row" style="margin-top:10px;">${c.images.map(()=>`<div class="upload-thumb">${icon('image',20)}</div>`).join('')}</div>`:''}
    </div>

    ${c.severityReason?`<div class="hint-banner" style="margin-bottom:14px;">${icon('spark',15)}<span><b>Why this severity:</b> ${c.severityReason} <span class="mock-tag">Simulated</span></span></div>`:''}

    <div class="card pad" style="margin-bottom:14px;">
      <b style="font-size:13px;">Status timeline</b>
      <div class="timeline" style="margin-top:14px;">
        ${c.history.map((h,i)=>`<div class="tl-item ${i<c.history.length-1?'done':'current'}">
          <div class="tl-title">${h.stage}</div>
          <div class="tl-meta">${fmtDateTime(h.ts)}</div>
          <div class="tl-note">${h.note}</div>
        </div>`).join('')}
      </div>
    </div>

    ${(c.status==='Resolved' && isCitizen) ? FeedbackBlock(c) : ''}
    ${c.feedback ? `<div class="card pad" style="margin-bottom:14px;"><b style="font-size:13px;">Citizen feedback</b><div class="flex items-center gap-8" style="margin-top:6px;">${'★'.repeat(c.feedback.rating)}${'☆'.repeat(5-c.feedback.rating)}</div><p class="small muted" style="margin-top:4px;">${c.feedback.comment}</p></div>` : ''}
  `;
  el.querySelector('#back-btn').onclick = ()=> go(isCitizen ? 'mine' : S.route);
  if(c.status==='Resolved' && isCitizen){
    setTimeout(()=>{
      const yes = el.querySelector('#fb-yes'), no = el.querySelector('#fb-no');
      if(yes) yes.onclick = ()=>{ submitFeedback(c, true); };
      if(no) no.onclick = ()=>{ submitFeedback(c, false); };
    },0);
  }
  return el;
}
function FeedbackBlock(c){
  return `<div class="card pad" style="margin-bottom:14px;">
    <b style="font-size:13px;">Was your issue resolved?</b>
    <div class="flex gap-10" style="margin-top:10px;">
      <button class="btn btn-amber btn-sm" style="flex:1;" id="fb-yes">${icon('check',13)} Yes, resolved</button>
      <button class="btn btn-outline btn-sm" style="flex:1;" id="fb-no">Not resolved</button>
    </div>
  </div>`;
}
function submitFeedback(c, resolved){
  if(resolved){
    c.feedback = {rating:5, comment:'Confirmed resolved by citizen.'};
    c.status='Closed';
    c.history.push({stage:'Citizen Confirmation', ts:Date.now(), note:'Citizen confirmed the issue is resolved.'});
    c.history.push({stage:'Closed', ts:Date.now()+1000, note:'Complaint closed.'});
    toast('Thank you — complaint closed','success');
  } else {
    c.status='Reopened';
    c.history.push({stage:'Reopened', ts:Date.now(), note:'Citizen reported issue as unresolved — reopened and department notified.'});
    DB.notifications.unshift({id:uid('N'), ts:Date.now(), unread:true, icon:'esc', title:`${c.id} reopened by citizen`, sub:c.department, audience:'staff'});
    toast('Complaint reopened — department notified','warn');
  }
  render();
}

function ComplaintTable(list, actionable){
  const wrap=document.createElement('div');
  const t=document.createElement('table');
  t.innerHTML = `<thead><tr><th>ID</th><th>Issue</th><th>Location</th><th>Priority</th><th>Severity</th><th>Citizen</th><th>Deadline</th><th>Status</th>${actionable?'<th>Action</th>':''}</tr></thead>`;

  list.forEach(c=>{
    const hl = hoursLeft(c);
    const tr=document.createElement('tr');
    tr.innerHTML = `
      <td><span class="mono small">${c.id}</span></td>
      <td>${c.type}</td>
      <td class="small">${c.ward}</td>
      <td><b>${c.priority}</b> <span class="small muted">${c.priorityLabel}</span></td>
      <td><span class="chip chip-${c.severity.toLowerCase()}">${c.severity}</span></td>
      <td class="small">${c.citizen}</td>
      <td class="small" style="color:${hl<0?'var(--red)':hl<8?'var(--amber)':'inherit'};">${['Resolved','Closed'].includes(c.status)?'—':(hl<0?'Overdue':Math.round(hl)+'h')}</td>

      ${actionable?'<td></td>':''}`;
    tr.style.cursor='pointer';
    tr.onclick=(e)=>{ if(e.target.closest('button'))return; S._activeComplaintId=c.id; go('complaint-detail'); };

function HotspotMap(){

    </div>
  </div>
  <div class="grid" style="grid-template-columns:2fr 1fr;gap:14px;">
    <div class="card" style="height:460px;"><div class="map-box" id="big-map" style="height:100%;"></div></div>

      <b style="font-size:13px;">Repeat problem areas</b>
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:10px;" id="hotspot-list"></div>
    </div>
  </div>`;
  function draw(){
    const map = el.querySelector('#big-map'); map.innerHTML='';
    let list = DB.complaints;
    if(S.mapFilter.category!=='all') list = list.filter(c=>c.categoryId===S.mapFilter.category);
    if(S.mapFilter.severity!=='all') list = list.filter(c=>c.severity===S.mapFilter.severity);
    const lats=list.map(c=>c.location.lat), lngs=list.map(c=>c.location.lng);
    const minLat=Math.min(...lats),maxLat=Math.max(...lats),minLng=Math.min(...lngs),maxLng=Math.max(...lngs);
    list.forEach(c=>{
      const x = 6+((c.location.lng-minLng)/(maxLng-minLng||1))*88;
      const y = 6+(1-(c.location.lat-minLat)/(maxLat-minLat||1))*88;
      const pin=document.createElement('div'); pin.className='map-pin '+c.severity.toLowerCase();
      pin.style.left=x+'%'; pin.style.top=y+'%';
      pin.innerHTML=`<div class="dot"></div><div class="pin-label">${c.id} · ${c.type}</div>`;
      pin.onclick=()=>{ S._activeComplaintId=c.id; go('complaint-detail'); };
      map.appendChild(pin);
    });
    map.innerHTML+=`<div class="map-legend"><span><i style="background:var(--sev-critical);"></i>Critical</span><span><i style="background:var(--sev-high);"></i>High</span><span><i style="background:var(--sev-medium);"></i>Medium</span><span><i style="background:var(--sev-low);"></i>Low</span></div>`;
    // hotspot ranking by ward
    const byWard = {};
    list.forEach(c=>{ byWard[c.ward]=(byWard[c.ward]||0)+1; });
    const ranked = Object.entries(byWard).sort((a,b)=>b[1]-a[1]);
    const hl = el.querySelector('#hotspot-list'); hl.innerHTML='';
    ranked.forEach(([ward,count])=>{
      hl.innerHTML += `<div class="flex items-center justify-between"><span class="small">${ward}</span><span class="chip chip-medium">${count} issues</span></div>`;
    });
  }
  el.querySelector('#f-cat').onchange=(e)=>{ S.mapFilter.category=e.target.value; draw(); };
  el.querySelector('#f-sev').onchange=(e)=>{ S.mapFilter.severity=e.target.value; draw(); };
  setTimeout(draw,0);
  return el;
}

/* --- tiny inline SVG chart helpers (no external chart lib needed) --- */
function barChart(data, color){
  const w=520,h=190,pad=28; const max=Math.max(...data.map(d=>d.value),1);
  const bw = (w-pad*2)/data.length;
  let bars='';
  data.forEach((d,i)=>{
    const bh = (d.value/max)*(h-50);
    const x = pad + i*bw + bw*0.18;
    const y = h-30-bh;
    bars += `<rect x="${x}" y="${y}" width="${bw*0.64}" height="${bh}" rx="4" fill="${color}" opacity="${0.55+0.45*(d.value/max)}"><title>${d.label}: ${d.value}</title></rect>
    <text x="${x+bw*0.32}" y="${h-14}" font-size="9.5" fill="var(--ink-soft)" text-anchor="middle">${d.label}</text>
    <text x="${x+bw*0.32}" y="${y-5}" font-size="10" fill="var(--ink)" text-anchor="middle" font-weight="700">${d.value}</text>`;
  });
  const svg = document.createElement('div');
  svg.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">${bars}</svg>`;
  return svg;
}
function lineChart(data){
  const w=460,h=190,pad=28; const max=Math.max(...data.map(d=>d.value),1);
  const stepX = (w-pad*2)/(data.length-1);
  let pts = data.map((d,i)=>`${pad+i*stepX},${h-30-(d.value/max)*(h-50)}`);
  const line = pts.join(' ');
  const area = `${pad},${h-30} ${line} ${pad+(data.length-1)*stepX},${h-30}`;
  let dots='', labels='';
  data.forEach((d,i)=>{
    const x=pad+i*stepX, y=h-30-(d.value/max)*(h-50);
    dots += `<circle cx="${x}" cy="${y}" r="3.4" fill="var(--amber)" stroke="#fff" stroke-width="1.5"/>`;
    labels += `<text x="${x}" y="${h-14}" font-size="9.5" fill="var(--ink-soft)" text-anchor="middle">${d.label}</text>`;
  });
  const svg = document.createElement('div');
  svg.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">
    <polygon points="${area}" fill="var(--amber)" opacity="0.12"/>
    <polyline points="${line}" fill="none" stroke="var(--navy)" stroke-width="2.2"/>
    ${dots}${labels}
  </svg>`;
  return svg;
}
function donutChart(data){
  const total = data.reduce((a,b)=>a+b.value,0)||1;
  let angle=0; const r=54,cx=70,cy=70;
  let paths='';
  data.forEach(d=>{
    const frac = d.value/total;
    const a0=angle, a1=angle+frac*2*Math.PI;
    const x0=cx+r*Math.sin(a0), y0=cy-r*Math.cos(a0);
    const x1=cx+r*Math.sin(a1), y1=cy-r*Math.cos(a1);
    const large = frac>0.5?1:0;
    paths += `<path d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} Z" fill="${d.color}" opacity="0.9"><title>${d.label}: ${d.value}</title></path>`;
    angle=a1;
  });
  const wrap=document.createElement('div'); wrap.style.cssText='display:flex;align-items:center;gap:18px;margin-top:8px;';
  wrap.innerHTML = `<svg width="140" height="140" viewBox="0 0 140 140">${paths}<circle cx="70" cy="70" r="30" fill="#fff"/></svg>
  <div style="display:flex;flex-direction:column;gap:6px;">
    ${data.map(d=>`<div class="flex items-center gap-8 small"><i style="width:9px;height:9px;border-radius:50%;background:${d.color};display:inline-block;"></i>${d.label} — <b>${d.value}</b></div>`).join('')}
  </div>`;
  return wrap;
}

  const labels = {severity:'Severity', community:'Community Support', impact:'Public Impact', waiting:'Waiting Time'};
  Object.keys(CONFIG.weights).forEach(k=>{
    const row=document.createElement('div');
    row.innerHTML=`<div class="flex items-center justify-between"><label class="f" style="margin:0;">${labels[k]}</label><span class="mono small" id="v-${k}">${CONFIG.weights[k]}%</span></div>
    <div class="slider-row"><input type="range" min="0" max="100" value="${CONFIG.weights[k]}" id="s-${k}"></div>`;
    wr.appendChild(row);
  });
  function updateSum(){
    const sum = Object.values(CONFIG.weights).reduce((a,b)=>a+b,0);
    w.querySelector('#wsum').innerHTML = sum===100 ? `<span style="color:var(--teal);font-weight:600;">${icon('check',12)} Weights total 100%</span>` : `<span style="color:var(--red);font-weight:600;">Weights total ${sum}% — should equal 100%</span>`;
  }
  Object.keys(CONFIG.weights).forEach(k=>{
    w.querySelector('#s-'+k).oninput=(e)=>{ CONFIG.weights[k]=+e.target.value; w.querySelector('#v-'+k).textContent=e.target.value+'%'; updateSum();
      DB.complaints.forEach(c=>{ c.priority=computePriority(c); c.priorityLabel=priorityLabel(c.priority); });
    };
  });
  updateSum();

  const dl = document.createElement('div'); dl.className='card pad'; dl.style.marginBottom='16px';
  dl.innerHTML = `<b style="font-size:13px;">Escalation deadlines (hours)</b><p class="small muted">Complaints exceeding the deadline are automatically escalated to Higher Authority.</p><div class="grid grid-4" style="margin-top:12px;" id="dl-rows"></div>`;
  el.appendChild(dl);
  const dlr = dl.querySelector('#dl-rows');
  SEVERITY_ORDER.forEach(s=>{
    const box=document.createElement('div');
    box.innerHTML=`<label class="f">${s}</label><input type="number" value="${CONFIG.deadlines[s]}" id="d-${s}">`;
    dlr.appendChild(box);
  });
  SEVERITY_ORDER.forEach(s=>{ dl.querySelector('#d-'+s).oninput=(e)=>{ CONFIG.deadlines[s]=+e.target.value||1; toast('Deadline for '+s+' updated to '+CONFIG.deadlines[s]+'h','default'); }; });

  const rt = document.createElement('div'); rt.className='card pad';
  rt.innerHTML = `<b style="font-size:13px;">Department routing rules</b><p class="small muted">Determines automatic department assignment by issue category.</p><div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;" id="route-rows"></div>`;
  el.appendChild(rt);
  const rr = rt.querySelector('#route-rows');
  CATEGORIES.forEach(c=>{
    rr.innerHTML += `<div class="flex items-center justify-between" style="padding:7px 0;border-bottom:1px solid var(--line);"><span class="small">${c.name}</span><span class="small" style="font-weight:600;">${icon('arrowRight',12)} ${ROUTING_RULES[c.id]}</span></div>`;
  });
  return el;
}

/* ---------------- HIGHER AUTHORITY ---------------- */

  const el=document.createElement('div');
  const esc = DB.complaints.filter(c=>c.status==='Escalated');
  const perf = computePerformance();
  el.innerHTML = `<div class="page-head"><div><div class="eyebrow">Regional oversight</div><h1>Higher Authority Overview</h1><p>Escalation monitoring and department accountability.</p></div>
  <button class="btn btn-outline" id="sim-time-h">${icon('clock',15)} Simulate 24 hours passing</button></div>
  <div class="grid grid-4" style="margin-bottom:16px;">
    <div class="card kpi accent-red"><div class="label">Active Escalations</div><div class="value">${esc.length}</div></div>
    <div class="card kpi accent-navy"><div class="label">Critical Open</div><div class="value">${DB.complaints.filter(c=>c.severity==='Critical'&&!['Resolved','Closed'].includes(c.status)).length}</div></div>
    <div class="card kpi accent-teal"><div class="label">Best Department</div><div class="value" style="font-size:15px;">${perf[0]?.dept.split(' ')[0]||'—'}</div></div>
    <div class="card kpi accent-amber"><div class="label">Avg City Score</div><div class="value">${Math.round(perf.reduce((a,d)=>a+d.score,0)/(perf.length||1))}</div></div>
  </div>
  <div class="card"><div class="pad" style="border-bottom:1px solid var(--line);"><b>Escalated complaints requiring review</b></div><div class="table-wrap" id="et"></div></div>`;
  el.querySelector('#et').appendChild(ComplaintTable(esc, true));
  el.querySelector('#sim-time-h').onclick=()=>{ simulateTimePass(24); toast('Simulated 24 hours — escalation chain re-evaluated','warn'); render(); };
  return el;
}
function EscalationsView(){
  const el=document.createElement('div');
  const esc = DB.complaints.filter(c=>c.status==='Escalated');
  el.innerHTML = `<div class="page-head"><div><div class="eyebrow">Delay management</div><h1>Escalations</h1><p>Officer → Higher Authority → Administrator chain, triggered automatically when a deadline lapses.</p></div></div>
  <div class="grid" id="esc-list" style="gap:12px;"></div>`;
  const list = el.querySelector('#esc-list');
  if(!esc.length) list.innerHTML = EmptyState('No active escalations','All departments are currently within their configured deadlines.');
  esc.forEach(c=>{
    const card=document.createElement('div'); card.className='card pad';
    card.innerHTML = `<div class="flex items-center justify-between"><span class="stamp" style="font-size:10.5px;padding:3px 7px;">${c.id}</span><span class="chip chip-escalated">Escalated</span></div>
    <div style="font-weight:700;margin-top:8px;">${c.type}</div>
    <div class="small muted">${c.department} · ${c.ward}</div>
    <div class="divider"></div>
    <div class="timeline">
      <div class="tl-item done"><div class="tl-title">Department Officer</div><div class="tl-meta">Deadline exceeded</div></div>
      <div class="tl-item done"><div class="tl-title">Higher Authority</div><div class="tl-meta">Notified for review</div></div>
      <div class="tl-item current"><div class="tl-title">Administrator</div><div class="tl-meta">Escalation visible on admin dashboard</div></div>
    </div>
    <button class="btn btn-primary btn-sm btn-block" data-open>${icon('arrowRight',13)} Review complaint</button>`;
    card.querySelector('[data-open]').onclick=()=>{ S._activeComplaintId=c.id; go('complaint-detail'); };
    list.appendChild(card);

/* ---------------- TIME SIMULATION (drives escalation engine) ---------------- */
function simulateTimePass(hours){
  DB.complaints.forEach(c=>{
    if(['Resolved','Closed','Suspicious'].includes(c.status)) return;
    c.createdAt -= 0; // no-op, we shift virtual "now" by adjusting deadlines check via createdAt offset
  });
  // simulate by pulling createdAt further into the past
  DB.complaints.forEach(c=>{
    if(['Resolved','Closed'].includes(c.status)) return;
    c._simShift = (c._simShift||0) + hours*3600000;
    const virtualCreated = c.createdAt - (c._simShift);
    const hl = (virtualCreated + (CONFIG.deadlines[c.severity]||72)*3600000 - Date.now())/3600000;
    if(hl < 0 && c.status !== 'Escalated'){
      c.status = 'Escalated'; c.escalated = true;
      c.history.push({stage:'Escalated', ts:Date.now(), note:'Deadline exceeded — automatically escalated to Higher Authority.'});
      DB.notifications.unshift({id:uid('N'), ts:Date.now(), unread:true, icon:'esc', title:`${c.id} auto-escalated`, sub:c.department, audience:'staff'});
    }
    c.createdAt = virtualCreated + hours*3600000*0; // keep createdAt display stable, deadline tracked via _simShift
    c.createdAt = virtualCreated;
  });
  DB.complaints.forEach(c=>{ c.priority=computePriority(c); c.priorityLabel=priorityLabel(c.priority); });
}
// override hoursLeft to consider simShift naturally since we mutate createdAt directly above.

/* ============================================================
   MODALS
   ============================================================ */
function ModalHost(){
  const ov = document.createElement('div'); ov.className='overlay';
  ov.onclick=(e)=>{ if(e.target===ov) setModal(null); };
  const m = document.createElement('div'); m.className='modal';
  const type = S.modal.type;
  if(type==='emergency') m.appendChild(EmergencyModal());
  else if(type==='remark') m.appendChild(RemarkModal(S.modal.id));
  else if(type==='notifications') m.appendChild(NotifModal());
  ov.appendChild(m);
  return ov;
}
function ModalHead(title){
  const h=document.createElement('div'); h.className='modal-head';
  h.innerHTML = `<b>${title}</b><button class="close-x">${icon('x',16)}</button>`;
  h.querySelector('.close-x').onclick=()=>setModal(null);
  return h;
}
function EmergencyModal(){
  const w=document.createElement('div');
  w.appendChild(ModalHead('Emergency Assistance'));
  const body=document.createElement('div'); body.className='modal-body';
  body.innerHTML = `
    <div class="danger-banner" style="margin-bottom:14px;">${icon('alert',15)}<span>Emergency reports receive <b>CRITICAL priority</b> and route immediately to the configured emergency authority.</span></div>
    <div class="field"><label class="f">Emergency type</label>
      <select id="etype"><option>Flooding</option><option>Natural disaster</option><option>Dangerous electrical hazard</option><option>Collapsed infrastructure</option><option>Other urgent situation</option></select></div>
    <div class="field"><label class="f">Description</label><textarea id="edesc" placeholder="Briefly describe the emergency"></textarea></div>
    <div class="field"><label class="f">Estimated people affected</label><input type="number" id="eaffected" placeholder="e.g. 15"></div>
    <div class="field"><label class="f">Contact number (optional)</label><input type="tel" id="econtact" placeholder="Optional"></div>
    <div class="hint-banner">${icon('pin',15)}<span>Current GPS location will be attached automatically.</span></div>`;
  w.appendChild(body);
  const foot=document.createElement('div'); foot.className='modal-foot';
  foot.innerHTML=`<button class="btn btn-outline" id="cancel">Cancel</button><button class="btn btn-danger" id="send">${icon('send',14)} Send Emergency Report</button>`;
  w.appendChild(foot);
  foot.querySelector('#cancel').onclick=()=>setModal(null);
  foot.querySelector('#send').onclick=()=>{
    const now=Date.now();
    const id = `CIV-2026-${String(DB.complaints.length+1).padStart(5,'0')}`;
    const loc = randLoc({lat:13.06,lng:80.24});
    const c = {
      id, categoryId:'emergency', categoryName:'Emergency / Disaster', type: body.querySelector('#etype').value,
      description: body.querySelector('#edesc').value || 'Emergency reported by citizen.',
      images:[1], location:loc, ward:nearestWard(loc), department:'District Emergency Response Cell',
      officer:OFFICERS['District Emergency Response Cell'], citizen:S.user.name, createdAt:now,
      status:'Assigned', supporters:0, verification:'VERIFIED', severity:'Critical', severityReason:'Emergency category — immediate public safety priority.',
      history:[
        {stage:'Submitted', ts:now, note:'Emergency report received.'},
        {stage:'Verified', ts:now+3000, note:'Emergency reports bypass standard verification queue.'},
        {stage:'Assigned', ts:now+6000, note:'Immediately routed to District Emergency Response Cell.'},
      ],
      feedback:null, escalated:false, aiConfidence:99,
    };
    c.priority=100; c.priorityLabel='CRITICAL';
    DB.complaints.unshift(c);
    DB.notifications.unshift({id:uid('N'), ts:now, unread:true, icon:'alert', title:'Emergency alert dispatched', sub:c.id, audience:'all'});
    setModal(null);
    toast('Emergency report sent — CRITICAL priority assigned','danger');
    S._activeComplaintId=c.id; go('complaint-detail');
  };
  return w;
}
function RemarkModal(id){
  const c = DB.complaints.find(x=>x.id===id);
  const w=document.createElement('div');
  w.appendChild(ModalHead('Add remark — '+id));
  const body=document.createElement('div'); body.className='modal-body';
  body.innerHTML = `<textarea id="rmk" placeholder="Add an action-taken note..."></textarea>`;
  w.appendChild(body);
  const foot=document.createElement('div'); foot.className='modal-foot';
  foot.innerHTML=`<button class="btn btn-outline" id="c1">Cancel</button><button class="btn btn-primary" id="s1">Save remark</button>`;
  w.appendChild(foot);
  foot.querySelector('#c1').onclick=()=>setModal(null);
  foot.querySelector('#s1').onclick=()=>{
    const v = body.querySelector('#rmk').value.trim();
    if(!v){ toast('Enter a remark first','warn'); return; }
    c.history.push({stage:c.status, ts:Date.now(), note:'Officer remark: '+v});
    setModal(null); toast('Remark added to '+id,'success'); render();
  };
  return w;
}
function NotifModal(){
  const w=document.createElement('div');
  w.appendChild(ModalHead('Notifications'));
  const body=document.createElement('div'); body.className='modal-body'; body.style.padding='0';
  DB.notifications.slice(0,15).forEach(n=>{
    const it=document.createElement('div'); it.className='notif-item'+(n.unread?' notif-unread':'');
    it.style.padding='12px 18px';
    it.innerHTML=`<div class="notif-ico">${icon(n.icon,16)}</div><div style="flex:1;"><div class="notif-text">${n.title}</div><div class="notif-sub">${n.sub}</div></div><div class="notif-time">${timeAgo(n.ts)}</div>`;
    it.onclick=()=>{ n.unread=false; render(); };
    body.appendChild(it);
  });
  w.appendChild(body);
  return w;
}

/* ============================================================
   BOOT
   ============================================================ */
render();
</script>
